[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
user=root

[program:sshd]
command=/usr/sbin/sshd -D -e
priority=10
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ttyd]
# No browser username/password is requested: the generated HTTPS URL is the access key.
command=/bin/bash -c 'exec /usr/local/bin/ttyd --writable --check-origin --port ${WEB_PORT} /usr/bin/su -s /bin/bash - ${WEB_USERNAME}'
priority=20
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/home/%(ENV_WEB_USERNAME)s",USER="%(ENV_WEB_USERNAME)s",SHELL="/bin/bash"
