[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
user=root

[program:sshd]
command=/usr/sbin/sshd -D -e
priority=10
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ttyd]
# Binds all interfaces (Railway's proxy cannot reach 127.0.0.1).
# ${WEB_PORT} / ${WEB_USERNAME} / ${SSH_PASSWORD} are exported by entrypoint.sh
# and expanded by this inner bash at runtime, so no secrets live in this file.
command=/bin/bash -c 'exec /usr/local/bin/ttyd --interface 0.0.0.0 --writable --check-origin --port ${WEB_PORT} -c ${WEB_USERNAME}:${SSH_PASSWORD} /usr/bin/su -s /bin/bash - ${WEB_USERNAME}'
priority=20
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/home/%(ENV_WEB_USERNAME)s",USER="%(ENV_WEB_USERNAME)s",SHELL="/bin/bash"
